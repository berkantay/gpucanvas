# Publishes the package to npm when a GitHub release is published.
#
# It uses npm trusted publishing: npm checks that the request comes from this repository and
# this workflow file, so no token is stored. Set it up once on npmjs.com, under the package's
# Settings, Trusted Publisher: GitHub Actions, repository berkantay/gpucanvas, workflow
# release.yml.
#
# To release: bump "version" in package.json, commit, tag vX.Y.Z, push, and publish a release
# for the tag. Run it by hand (Actions, Release, Run workflow) to publish what main holds.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - name: Check the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "Release ${{ github.event.release.tag_name }} does not match package.json version $version"
            exit 1
          fi
          if [ "$(npm view gpucanvas@$version version 2>/dev/null)" = "$version" ]; then
            echo "gpucanvas@$version is already on npm"
            exit 1
          fi
      # prepublishOnly typechecks and builds first.
      - run: npm publish --access public
